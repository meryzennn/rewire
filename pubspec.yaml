name: rewire
description: Rewire, an offline-first wellbeing app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  go_router: ^14.0.0
  sqflite: ^2.3.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.1.0
  audioplayers: ^6.0.0
  flutter_local_notifications: ^17.0.0
  fl_chart: ^0.68.0
  lottie: ^3.1.0
  intl: ^0.19.0
  path_provider: ^2.1.0
  path: ^1.9.0
  wakelock_plus: ^1.2.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
  assets:
    - assets/fonts/OFL-Nunito.txt
    - assets/audio/
    - assets/images/brain/
    - assets/images/exercises/
    - assets/images/onboarding/
    - assets/data/
